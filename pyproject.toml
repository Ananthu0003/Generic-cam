[project]
name = "generic-cam"
version = "0.1.0"
description = "Generic geometry-driven CAM toolpath planning and G-code generation from STEP files"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "cadquery-ocp",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cam_engine*"]
